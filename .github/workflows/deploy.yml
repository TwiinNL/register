# =============================================================================
# Bouw de Hugo-site + Pagefind-index en publiceer naar GitHub Pages.
#
# Draait op een GitHub-hosted runner (ubuntu-latest). Hugo en Pagefind worden
# als statische binaries opgehaald (geen container/Node nodig). Het resultaat
# wordt via de officiele Pages-artifact-flow gedeployed. Live op het org-Pages-domein:
# https://fhir.twiin.nl/register/  (twiinnl.github.io/register/ redirect hierheen).
#
# Vereist eenmalig: Settings > Pages > Build and deployment > Source = "GitHub Actions".
# De vooraf gegenereerde static/inject.js wordt meegepubliceerd (geen Python nodig).
# =============================================================================
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Voorkom overlappende deploys; laat een lopende deploy afmaken.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: "0.163.3"
  PAGEFIND_VERSION: "1.5.2"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # nodig voor enableGitInfo (Lastmod)

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Installeer Hugo + Pagefind (statische binaries)
        run: |
          set -eux
          mkdir -p "$HOME/bin"
          curl -sSL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" -o /tmp/hugo.tar.gz
          tar -xzf /tmp/hugo.tar.gz -C "$HOME/bin" hugo
          curl -sSL "https://github.com/Pagefind/pagefind/releases/download/v${PAGEFIND_VERSION}/pagefind-v${PAGEFIND_VERSION}-x86_64-unknown-linux-musl.tar.gz" -o /tmp/pagefind.tar.gz
          tar -xzf /tmp/pagefind.tar.gz -C "$HOME/bin" pagefind
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/hugo" version
          "$HOME/bin/pagefind" --version

      - name: Bouw site + zoekindex
        run: |
          set -eux
          hugo --minify --gc
          pagefind --site public

      - name: Upload Pages-artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publiceer naar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

<!DOCTYPE html>
{{- /* Standalone, chrome-loze pagina met alleen het register-blok.
       Bedoeld om via <iframe> te embedden (bv. op een Scroll/Confluence-pagina).
       Bevat geen {{ define }}, dus baseof (header/footer) wordt NIET toegepast. */ -}}
<html lang="{{ site.Language.Lang | default "nl" }}" data-basepath="{{ site.Home.RelPermalink }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Register — {{ site.Title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="{{ "css/main.css" | relURL }}">
  <link rel="stylesheet" href="{{ "css/pagefind-overrides.css" | relURL }}">
  <style>
    body { margin:0; background:var(--bg); }
    .embed-wrap { max-width:1140px; margin-inline:auto; padding:1rem 1.1rem 2rem; }
  </style>
</head>
<body>
  <main class="embed-wrap">
    {{ partial "register.html" . }}
  </main>
  <script type="module" src="{{ "js/register.js" | relURL }}"></script>
  <script>
    /* Meld de hoogte aan de parent (voor auto-resize van de iframe). */
    (function () {
      function post() {
        try { parent.postMessage({ type: "twiin-embed-height", height: document.documentElement.scrollHeight }, "*"); } catch (e) {}
      }
      if ("ResizeObserver" in window) { new ResizeObserver(post).observe(document.body); }
      window.addEventListener("load", post);
      window.addEventListener("resize", post);
    })();
  </script>
</body>
</html>

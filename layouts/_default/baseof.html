<!DOCTYPE html>
<html lang="{{ site.Language.Lang | default "nl" }}" data-basepath="{{ site.Home.RelPermalink }}">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  {{ partial "header.html" . }}
  <main class="site-main" id="content">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
  <script src="{{ "js/main.js" | relURL }}"></script>
  {{ block "scripts" . }}{{ end }}
</body>
</html>

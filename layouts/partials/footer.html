<footer class="site-footer">
  <div class="wrap site-footer__inner">
    <div>
      <img class="site-footer__logo" src="{{ "images/twiin-logo.png" | relURL }}" alt="Twiin" width="92" height="40">
    </div>
    <div class="site-footer__meta">
      <p class="site-footer__license">
        <a href="{{ site.Params.licentieURL }}" rel="license external">
          <img src="{{ "images/cc-by-sa.png" | relURL }}" alt="Creative Commons Naamsvermelding-GelijkDelen 4.0" width="88" height="31">
        </a>
        <span>Deze publicatie valt onder <a href="{{ site.Params.licentieURL }}" rel="license external">{{ site.Params.licentie }}</a>.</span>
      </p>
      <p>© {{ now.Year }} {{ site.Params.organisatie }}. Gepubliceerd via Codeberg Pages.</p>
    </div>
  </div>
</footer>

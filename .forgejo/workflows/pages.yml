# =============================================================================
# Bouw de Hugo-site + Pagefind-index en publiceer naar Codeberg Pages.
#
# Draait op de Codeberg gedeelde runner (label `codeberg-medium`). Hugo en
# Pagefind worden als statische binaries opgehaald (geen container/Node nodig).
# Het resultaat wordt naar branch `pages` van deze repo geduwd en is dan
# bereikbaar op https://las.codeberg.page/playground/ .
# =============================================================================
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # nodig om naar branch `pages` te kunnen pushen

env:
  HUGO_VERSION: "0.163.3"
  PAGEFIND_VERSION: "1.5.2"

jobs:
  build-and-deploy:
    runs-on: codeberg-medium
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # nodig voor enableGitInfo (Lastmod)

      - name: Installeer Hugo + Pagefind (statische binaries)
        run: |
          set -eux
          mkdir -p "$HOME/bin"
          curl -sSL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" -o /tmp/hugo.tar.gz
          tar -xzf /tmp/hugo.tar.gz -C "$HOME/bin" hugo
          curl -sSL "https://github.com/Pagefind/pagefind/releases/download/v${PAGEFIND_VERSION}/pagefind-v${PAGEFIND_VERSION}-x86_64-unknown-linux-musl.tar.gz" -o /tmp/pagefind.tar.gz
          tar -xzf /tmp/pagefind.tar.gz -C "$HOME/bin" pagefind
          "$HOME/bin/hugo" version
          "$HOME/bin/pagefind" --version

      - name: Bouw site + zoekindex
        run: |
          set -eux
          "$HOME/bin/hugo" --minify --gc
          "$HOME/bin/pagefind" --site public

      - name: Publiceer naar Codeberg Pages (branch `pages`)
        run: |
          set -eu
          cd public
          touch .nojekyll
          git init -q
          git config user.name "Forgejo Actions"
          git config user.email "actions@noreply.codeberg.org"
          git checkout -q -b pages
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA:-handmatig} [skip ci]"
          git push -f "https://x-access-token:${{ forge.token }}@codeberg.org/${{ forge.repository }}.git" pages
          echo "Gepubliceerd → https://las.codeberg.page/playground/"

# =============================================================================
# Bouw de Hugo-site + Pagefind-index en publiceer naar Codeberg Pages.
#
# Resultaat wordt naar de branch `pages` van DEZE repo geduwd en is dan
# bereikbaar op:  https://<eigenaar>.codeberg.page/<repo>/
# (bij LAS/playground dus: https://las.codeberg.page/playground/ )
#
# Wil je in plaats daarvan op de root  https://las.codeberg.page/  publiceren?
# Maak dan een aparte repo `LAS/pages`, zet daar een access-token als
# secret (bv. DEPLOY_TOKEN) en pas de deploy-stap aan (zie README.md).
# =============================================================================
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  HUGO_VERSION: "0.163.3"
  PAGEFIND_VERSION: "1.5.2"

jobs:
  build-and-deploy:
    runs-on: docker
    container:
      image: node:20-bookworm
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # nodig voor enableGitInfo (Lastmod)

      - name: Installeer Hugo (extended)
        run: |
          set -e
          curl -sSL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" -o /tmp/hugo.tar.gz
          tar -xzf /tmp/hugo.tar.gz -C /tmp hugo
          install /tmp/hugo /usr/local/bin/hugo
          hugo version

      - name: Bouw site
        run: hugo --minify --gc

      - name: Bouw zoekindex (Pagefind)
        run: npx -y "pagefind@${PAGEFIND_VERSION}" --site public

      - name: Publiceer naar Codeberg Pages (branch `pages`)
        if: ${{ forge.event_name == 'push' && forge.ref == 'refs/heads/main' }}
        uses: actions/git-pages@v2
        with:
          site: "https://${{ forge.event.repository.owner.username }}.codeberg.page/${{ forge.event.repository.name }}/"
          token: ${{ forge.token }}
          source: public/

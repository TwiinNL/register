# =============================================================================
# Bouw de Hugo-site + Pagefind-index en publiceer naar Codeberg Pages.
#
# Het resultaat wordt naar de branch `pages` van DEZE repo geduwd en is dan
# bereikbaar op:  https://<eigenaar>.codeberg.page/<repo>/
# (bij LAS/playground dus: https://las.codeberg.page/playground/ )
#
# Wil je op de root  https://las.codeberg.page/  publiceren? Maak dan een aparte
# repo `LAS/pages`, push de build daarheen met een access-token-secret en zet
# baseURL in hugo.toml om (zie README.md).
# =============================================================================
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # nodig om naar de branch `pages` te kunnen pushen

env:
  HUGO_VERSION: "0.163.3"
  PAGEFIND_VERSION: "1.5.2"

jobs:
  build-and-deploy:
    runs-on: codeberg-small
    container:
      image: node:20-bookworm   # bevat git, curl, tar en node/npx
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # nodig voor enableGitInfo (Lastmod)

      - name: Installeer Hugo (extended)
        run: |
          set -e
          curl -sSL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" -o /tmp/hugo.tar.gz
          tar -xzf /tmp/hugo.tar.gz -C /tmp hugo
          install /tmp/hugo /usr/local/bin/hugo
          hugo version

      - name: Bouw site
        run: hugo --minify --gc

      - name: Bouw zoekindex (Pagefind)
        run: npx -y "pagefind@${PAGEFIND_VERSION}" --site public

      - name: Publiceer naar Codeberg Pages (branch `pages`)
        run: |
          set -e
          cd public
          git init -q
          git config user.name "Forgejo Actions"
          git config user.email "actions@noreply.codeberg.org"
          git checkout -q -b pages
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA:-handmatig} [skip ci]"
          git push -f "https://x-access-token:${{ forge.token }}@codeberg.org/${{ forge.repository }}.git" pages
          echo "Gepubliceerd naar branch 'pages'. Live op https://las.codeberg.page/playground/"
